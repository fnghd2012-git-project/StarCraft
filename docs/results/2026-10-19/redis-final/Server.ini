; 로컬 테스트 설정. 데이터 경로는 이 파일이 있는 폴더를 기준으로 한다.
[Network]
; 메인 스레드의 접속 수락과 별개로 실제 송수신을 담당하는 워커 수.
WorkerCount=4
MaxClientsPerWorker=1024
MaxPendingSendBytes=262144
; 게임 스레드가 만든 응답은 WSAPoll을 깨우지 않으므로 다음 큐 확인까지의 대기를 제한한다.
PollTimeoutMs=5

; DB 연결 주소는 MTS_DB_* 환경 변수, 작업 수와 접속 유효 시간은 여기서 관리한다.
StopFile=stop.request

[Database]
Realm=battle_57761a86e07b4d7fabe1f0799e8656f6
WorkerCount=6
QueueCapacity=4096
SessionLeaseSeconds=60

; World 랭킹은 전용 Redis 워커 한 개에서 처리한다. 연결 장애 중에도 전투는 계속한다.
[Redis]
Enabled=1
Host=127.0.0.1
Port=6379
KeyPrefix=portfolio
TimeoutMs=200
FlushIntervalMs=1000
RetentionSeconds=604800
QueryCapacity=64

; World 전투 기록. 파일/큐 상한 초과 시 해당 기록을 실패 표시하고 전투는 계속한다.
[Replay]
Enabled=1
Directory=Replays
QueueMB=32
MaxFileMB=1024
SnapshotSeconds=1
; 원본 전투는 매 틱 기록한다. 대규모 시연에서만 4로 바꾸어 20Hz 중 5Hz 상태를 저장한다.
FrameTicks=4

; 전투 틱 비용과 명령/DB/기록 큐 현황을 콘솔에 주기적으로 출력한다.
[Metrics]
IntervalSeconds=5

[World]
ServerId=World
ServerType=World
Race=None
Address=127.0.0.1
Port=61113

[Data]
ServerFile=Data/GameServer.csv
UnitFile=Data/Unit.csv
SkillFile=Data/Skill.csv
MapFile=Data/Map.ini
StartPointFile=Data/StartPoint.csv

; 전장 틱, 입장 상한, MP 회복, 사망/자발적 복귀 대기, 경기 재시작 설정.
; 클로킹은 스킬 실행 단계에서 PauseMpRegenWhileCloaked를 적용한다.
[Battle]
MaxWorldPlayers=1500
; 한 경기의 누적 참가 계정 상한. 접속을 반복해도 같은 계정은 한 번만 센다.
MaxMatchParticipants=10000
; 게임 서버별 값이 없을 때 사용하는 로그인 인원 제한(처리 중인 로그인 포함).
MaxGamePlayers=500
; 0=기존 전체 시야. 양수=해당 거리 안의 근처 적 32명/아군 31명과 자신만 전송한다.
SnapshotRadius=25
; 기존 전체 탐색=Linear, 공간 격자 탐색=Grid. 서버 시작 시 읽으므로 변경 후 재시작한다.
SpatialSearch=Grid
SpatialCellSize=25
; 1이면 매 Snapshot에서 반대 방식으로도 최종 목록을 계산해 비교한다. 성능 측정은 0으로 한다.
VerifySpatialSearch=0
BuildingDetectionRange=10
TickRate=20
MpRegenPerSecond=1
PauseMpRegenWhileCloaked=1
DeathReentrySeconds=100
RoundRestartSeconds=300

; CSV의 Index에 대응한다. 예: Index가 1이면 [Server.1]. World는 MaxWorldPlayers를 사용한다.
; 서버별 제한은 로그인 및 복귀 로그인에 모두 적용한다.
[Server.A]
MaxPlayers=500
[Server.B]
MaxPlayers=500
[Server.C]
MaxPlayers=500
